<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft Username Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .username-box {
            background: #f0f0f0;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            word-break: break-word;
            min-height: 35px;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background-color: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Eaglercraft Username Generator</h1>
        
        <div class="username-box" id="username"></div>

        <button onclick="generateUsername()">Generate Username</button>
    </div>

    <script>
        const names = ['Yeel', 'Darver', 'Eagl', 'Yeeish', 'Yeer', 'Yigg'];

        function getRandomName() {
            return names[Math.floor(Math.random() * names.length)];
        }

        function getRandomNumber() {
            return Math.floor(Math.random() * 9999) + 1; // 1-9999
        }

        function generateUsername() {
            let name1 = getRandomName();
            let name2 = getRandomName();

            // Ensure name2 is different from name1
            while (name2 === name1) {
                name2 = getRandomName();
            }

            const randomNumber = getRandomNumber();
            const username = name1 + name2 + randomNumber;

            document.getElementById('username').textContent = username;
        }

        // Generate username on page load
        generateUsername();
    </script>
</body>
</html>
